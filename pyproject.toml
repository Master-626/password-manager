[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "password-manager"
version = "0.1.1"
description = "A generator-only CLI using Python secrets; password storage is not implemented."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "Xu Jiaqi", email = "jiaqixu12138@gmail.com" }]
dependencies = ["click>=8.0.0"]

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.6"]

[project.scripts]
passman = "password_manager.cli:main"

[project.urls]
Homepage = "https://github.com/Master-626/password-manager"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py38"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# Click options are conventionally constructed in argument defaults.
ignore = ["B008"]
